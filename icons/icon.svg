<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="emberGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FF5500" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B30000" stop-opacity="0" />
    </radialGradient>
    <filter id="comicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#1A0500" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Flame Glow -->
  <circle cx="50" cy="55" r="42" fill="url(#emberGlow)" />

  <!-- Outer Dark Flame (Silhouette / Border effect) -->
  <path d="M50 5 
           C42 22, 30 25, 20 40 
           C10 55, 12 70, 24 84 
           C34 94, 66 94, 76 84 
           C88 70, 90 55, 80 40 
           C72 26, 68 28, 62 18 
           C58 26, 54 18, 50 5 Z" 
        fill="#1A0500" />

  <!-- Outer Red Flame -->
  <path d="M50 9 
           C43 24, 32 28, 23 42 
           C14 56, 16 69, 27 82 
           C36 91, 64 91, 73 82 
           C84 69, 86 56, 77 42 
           C70 29, 66 30, 60 21 
           C56 28, 53 20, 50 9 Z" 
        fill="#E62200" />

  <!-- Mid Orange Flame -->
  <path d="M49 22 
           C43 33, 35 38, 29 50 
           C22 62, 26 73, 34 82 
           C42 89, 58 89, 66 82 
           C74 73, 78 62, 71 50 
           C65 39, 61 40, 57 32 
           C54 38, 52 30, 49 22 Z" 
        fill="#FF7700" />

  <!-- Core Yellow Flame -->
  <path d="M49 38 
           C44 46, 38 52, 35 62 
           C31 71, 35 79, 42 83 
           C47 87, 53 87, 58 83 
           C65 79, 69 71, 65 62 
           C61 54, 57 52, 54 46 
           C52 50, 51 44, 49 38 Z" 
        fill="#FFD200" />

  <!-- Inner Bright Hot Spot -->
  <ellipse cx="50" cy="74" rx="9" ry="11" fill="#FFFBE6" />

  <!-- Cartoon Expressive Eyes -->
  <!-- Left Eye -->
  <ellipse cx="40" cy="56" rx="5" ry="7" fill="#1A0500" transform="rotate(-6 40 56)" />
  <circle cx="39" cy="54" r="2" fill="#FFFFFF" />
  
  <!-- Right Eye -->
  <ellipse cx="60" cy="56" rx="5" ry="7" fill="#1A0500" transform="rotate(6 60 56)" />
  <circle cx="61" cy="54" r="2" fill="#FFFFFF" />

  <!-- Determined / Cheeky Smirk -->
  <path d="M43 68 Q50 74 57 68" stroke="#1A0500" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
