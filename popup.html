<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Doomscroll Inferno</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-flame-icon">🔥</div>
      <div>
        <h1 class="header-title">Doomscroll Inferno</h1>
        <p class="header-subtitle">LinkedIn Anti-Scroll Fire</p>
      </div>
    </header>

    <!-- Live Status Box -->
    <div class="status-card">
      <div class="status-header">
        <span class="status-label">Current Feed Heat</span>
        <span class="status-badge" id="heat-badge">Simmering</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="popup-progress-fill"></div>
      </div>
      <div class="counter-display" id="popup-counter-text">0 / 10 posts scrolled</div>
    </div>

    <!-- Controls -->
    <div class="settings-group">
      <label class="setting-row">
        <span>Enable Flames</span>
        <input type="checkbox" id="toggle-flames" checked>
      </label>

      <div class="setting-row-vertical">
        <div class="slider-header">
          <span>Inferno Threshold:</span>
          <span class="threshold-number" id="threshold-val">10 posts</span>
        </div>
        <input type="range" id="threshold-slider" min="3" max="30" value="10" step="1">
        <span class="slider-hint">Flames cover 100% of page when this limit is reached.</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions-group">
      <button class="btn btn-primary" id="btn-test-inferno">
        🔥 Test Full Screen Inferno
      </button>
      <button class="btn btn-secondary" id="btn-reset-counter">
        💧 Reset Post Counter
      </button>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>Break the scroll. Contribute or escape!</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
